[package]
name = "schema-lib"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
wide-log = { path = "../../.." }

# In tracing mode the macro-generated code references `::tracing` and
# `::tracing_subscriber` paths directly, so a schema crate enabling the
# feature must depend on both (the root crate's dev-deps do the same for
# its own tests).
tracing = { version = "0.1", optional = true }
tracing-subscriber = { version = "0.3", default-features = false, features = ["registry"], optional = true }

[features]
tracing = ["wide-log/tracing", "dep:tracing", "dep:tracing-subscriber"]