# cargo-deny configuration for wide-log
# See https://embarkstudios.github.io/cargo-deny/

[graph]
# We allow multiple versions of the same crate; e.g. faststr, itoa, ryu, etc.
# may be pulled in by transitive dependencies at different versions.
all-features = false
no-default-features = false

[advisories]
# Don't fail CI on unmaintained-warnings; only fail on real vulnerabilities.
version = 2
yanked = "warn"
ignore = []

[licenses]
# Allow only permissive licenses commonly used in the Rust ecosystem.
# Adjust this list as the dependency graph changes.
version = 2
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "Unicode-3.0",
]
confidence-threshold = 0.8

[[licenses.clarify]]
name = "ring"
version = "*"
expression = "MIT AND ISC AND OpenSSL"
license-files = [
    { path = "LICENSE", hash = 0xbd0eed23 },
]

[[licenses.clarify]]
name = "rustls-webpki"
version = "*"
expression = "ISC AND BSD-3-Clause AND OpenSSL"
license-files = [
    { path = "LICENSE", hash = 0x001e9169 },
]

[bans]
# Don't allow known-bad crates; we only ban a small handful here.
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"
deny = []
skip = []
skip-tree = []

[sources]
unknown-registry = "deny"
unknown-git = "warn"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
