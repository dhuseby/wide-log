[package]
name = "wide-log"
version = "0.1.0"
edition = "2024"

[dependencies]
smallvec = { version = "1", features = ["union", "write", "serde"] }
faststr = "0.2"
sonic-rs = "0.5"
serde = { version = "1", features = ["derive"] }
thiserror = "2"
tracing = "0.1"
wide-log-macros = { path = "wide-log-macros" }

# optional
tokio = { version = "1", features = ["rt"], optional = true }
tower = { version = "0.5", optional = true }

[features]
default = []
tokio = ["dep:tokio", "dep:tower", "wide-log-macros/tokio"]

[dev-dependencies]
criterion = { version = "0.8", features = ["html_reports"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "sync"] }

[[bench]]
name = "comparison"
harness = false

[[test]]
name = "async"
required-features = ["tokio"]