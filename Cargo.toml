[package]
name = "wide-log"
version = "0.4.0"
authors = ["David Grantham"]
edition = "2024"
description = "A fast wide event logging crate a la loggingsucks.com"
license = "Apache-2.0"
readme = "README.md"
repository = "https://github.com/dhuseby/wide-log"

[dependencies]
chrono = "0.4"
chrono-tz = "0.10"
faststr = "0"
itoa = "1"
ryu = "1"
serde = { version = "1", features = ["derive"] }
smallvec = { version = "1", features = ["union", "write", "serde"] }
sonic-rs = "0"
thiserror = "2"
tracing = "0"
ulid = "3"
wide-log-macros = { version = "0.4", path = "wide-log-macros" }

# optional
tokio = { version = "1", features = ["rt"], optional = true }
tower = { version = "0", optional = true }
uuid = { version = "1", features = ["v4"], optional = true }

[features]
default = []
tokio = ["dep:tokio", "dep:tower", "wide-log-macros/tokio"]
uuid = ["dep:uuid", "wide-log-macros/uuid"]

[dev-dependencies]
tracing-subscriber = { version = "0", features = ["env-filter"] }
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "sync", "net"] }
axum = { version = "0", default-features = false, features = ["http1", "tokio"] }
criterion = { version = "0", default-features = false, features = ["cargo_bench_support", "plotters"] }

[[bench]]
name = "core"
harness = false

[[test]]
name = "async"
required-features = ["tokio"]

[[example]]
name = "async_single_thread"
required-features = ["tokio"]

[[example]]
name = "async_multi_thread"
required-features = ["tokio"]

[[example]]
name = "axum_ok"
required-features = ["tokio"]

[[example]]
name = "custom_keys"
